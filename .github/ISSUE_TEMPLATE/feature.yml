name: Feature request
description: Describe a change so that it can be clarified, built and verified
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Who needs what, and why? Describe the problem, not the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Numbered, testable statements. Leave empty if you want them proposed during intent clarification.
      placeholder: |
        1. ...
        2. ...
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - UI
        - MQTT
        - Storage and migration
        - Secrets
        - Scripting
        - Plugins
        - Packaging and CI
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: risk
    attributes:
      label: Risk
      description: Any checked box makes this a high-risk change that needs a human review of the affected boundary.
      options:
        - label: Touches passwords, key material or the keyring
        - label: Changes migration of existing user data
        - label: Changes the plugin manifest, DTOs or host API
        - label: Changes the scripting host bindings
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Alternatives considered, screenshots, related issues. Never paste secrets.
